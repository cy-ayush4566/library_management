<section class="form-panel"><form method="post" enctype="multipart/form-data" class="stack-form">{% csrf_token %}{% for field in form %}<div><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}</div>{% endfor %}<button class="btn primary" type="submit">Save</button></form></section>
